      Get in touch
    </button>
  </div>
  
  <script>
  (function() {
    const widget = document.getElementById('contact-widget');
    const button = document.getElementById('contact-widget-button');
    if (!widget || !button) return;
  
    let isOpen = false;
    let isVisible = false;
  
    // Reveal widget after light scroll
    function checkScroll() {
      if (!isVisible && window.scrollY > 100) {
        widget.classList.add('contact-widget--visible');
        widget.setAttribute('aria-hidden', 'false');
        isVisible = true;
      }
    }
    window.addEventListener('scroll', checkScroll, { passive: true });
    checkScroll();
  
    // Toggle panel on button click
    function togglePanel(e) {
      e.stopPropagation();
      isOpen = !isOpen;
      widget.classList.toggle('contact-widget--open', isOpen);
      button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    button.addEventListener('click', togglePanel);
  
    // Close on outside click
    document.addEventListener('click', function(e) {
      if (isOpen && !widget.contains(e.target)) {
        isOpen = false;
        widget.classList.remove('contact-widget--open');
        button.setAttribute('aria-expanded', 'false');
      }
    });
  
    // Close on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && isOpen) {
        isOpen = false;
        widget.classList.remove('contact-widget--open');
        button.setAttribute('aria-expanded', 'false');
        button.focus();
      }
    });
  })();
  </script>
